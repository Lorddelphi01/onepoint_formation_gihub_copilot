name: 💡 Suggestion de fonctionnalité
description: Proposer un nouveau contenu, un nouveau sujet de chapitre, ou une amélioration du cours
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Une idée pour améliorer ce cours ? Nous serions ravis de l'entendre !

  - type: dropdown
    id: type
    attributes:
      label: Quel type d'amélioration ?
      options:
        - "Nouveau chapitre ou section"
        - "Nouvelle application ou exercice d'exemple"
        - "Améliorer le contenu existant"
        - "Ajouter un exemple d'agent ou de skill"
        - "Meilleure explication d'un concept"
        - "Autre"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Décris ton idée
      description: Qu'aimerais-tu voir ajouté ou modifié ? Pourquoi cela aiderait-il les apprenants ?
      placeholder: "Il serait utile d'avoir une section sur..."
    validations:
      required: true

  - type: textarea
    id: audience
    attributes:
      label: À qui cela profiterait-il ?
      description: Est-ce pour des débutants complets, des utilisateurs intermédiaires, ou un public spécifique ?
      placeholder: "Les débutants qui découvrent le terminal..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: As-tu vu cela traité ailleurs ? Existe-t-il une solution de contournement ?
    validations:
      required: false
